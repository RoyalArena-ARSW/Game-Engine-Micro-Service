# ============ Aplicación ============
spring.application.name=game-engine
server.port=${SERVER_PORT:8084}

# ============ Configuración del juego ============
# Duración de la partida en segundos (3 minutos como Clash Royale)
game.match.duration-seconds=${MATCH_DURATION:180}
# Intervalo del game loop en milisegundos
game.tick.interval-ms=${TICK_INTERVAL:100}
# Threads del pool compartido para los game loops
game.engine.thread-pool-size=${ENGINE_THREADS:4}

# ============ URLs de otros servicios (Fase 4) ============
services.deck-and-cards.url=${CARDS_SERVICE_URL:http://localhost:8081}
services.internal-secret=${INTERNAL_SECRET:royalarena-internal-secret-dev}

# ============ Logging ============
logging.level.edu.eci.arsw.RoyalArena=${LOG_LEVEL:INFO}